<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-label="Application staging and direct SQL and file migration"><title>Application staging and direct SQL and file migration</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7aa9d8"/></marker></defs><rect width="1200" height="730" fill="#f0f6fc"/><text x="60" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0b1f3a">Rebuild the host. Migrate and verify the workload.</text><rect x="60" y="110" width="300" height="195" rx="14" fill="#fff" stroke="#7aa9d8" stroke-width="2"/><text x="78" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0b1f3a">Source Windows VM</text><text x="78" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#526a86">IIS + SQL Express + SMB</text><text x="78" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#526a86">Azure-hosted source site</text><text x="78" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#526a86">10.100.0.0/16</text><text x="78" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#526a86">BACPAC stays on this VM</text><rect x="450" y="110" width="300" height="160" rx="14" fill="#0f4c81" stroke="#7aa9d8" stroke-width="2"/><text x="468" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">Private blob staging</text><text x="468" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#d7e2f0">Current IIS package</text><text x="468" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#d7e2f0">IIS config + manifest</text><text x="468" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#d7e2f0">No database/file payload</text><rect x="840" y="110" width="300" height="160" rx="14" fill="#fff" stroke="#7aa9d8" stroke-width="2"/><text x="858" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0b1f3a">Target IIS VM</text><text x="858" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#526a86">Fresh Windows host</text><text x="858" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#526a86">Target runtime identity</text><text x="858" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#526a86">10.200.0.0/16</text><g stroke="#7aa9d8" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M360 190 H440"/><path d="M750 190 H830"/><path d="M210 305 V400 H830"/></g><text x="300" y="383" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#0f4c81">Direct SQL import + direct file copy</text><rect x="840" y="330" width="300" height="150" rx="14" fill="#fff" stroke="#7aa9d8" stroke-width="2"/><text x="858" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0b1f3a">Target data services</text><text x="858" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#526a86">Azure SQL Database</text><text x="858" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#526a86">Azure Files</text><text x="858" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#526a86">Private endpoints</text><rect x="60" y="500" width="680" height="120" rx="14" fill="#fff" stroke="#7aa9d8" stroke-width="2"/><text x="78" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0b1f3a">Shared foundation</text><text x="78" y="565" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#526a86">Private DNS · peering · stable migration identity</text><text x="78" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#526a86">Monitoring · optional backup · budgets</text><rect x="840" y="520" width="300" height="100" rx="14" fill="#fff" stroke="#7aa9d8" stroke-width="2"/><text x="858" y="552" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0b1f3a">Cutover state</text><text x="858" y="585" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#526a86">Private application DNS</text><text x="60" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#526a86">The target OS is rebuilt. CSV assessment does not replicate servers.</text></svg>
