<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Cutover rollback and acceptance"><title>Cutover rollback and acceptance</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f7fbff"/><stop offset="100%" stop-color="#eaf2fb"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7aa9d8"/></marker></defs><rect width="1200" height="620" fill="url(#bg)"/><text x="60" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0b1f3a" text-anchor="start">Acceptance is the data-authority boundary</text><rect x="60" y="120" width="300" height="160" rx="14" fill="#ffffff" stroke="#7aa9d8" stroke-width="2"/><text x="82" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b1f3a" text-anchor="start">Final migration</text><text x="82" y="189" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Fence source</text><text x="82" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Copy consistent data</text><text x="82" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Validate target</text><rect x="450" y="120" width="300" height="160" rx="14" fill="#ffffff" stroke="#7aa9d8" stroke-width="2"/><text x="472" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b1f3a" text-anchor="start">Cutover</text><text x="472" y="189" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">DNS points at target</text><text x="472" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Target remains fenced</text><text x="472" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Observe real response</text><rect x="840" y="120" width="300" height="160" rx="14" fill="#0f4c81" stroke="#7aa9d8" stroke-width="2"/><text x="862" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="start">Accept</text><text x="862" y="189" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#d7e2f0" text-anchor="start">Target authoritative</text><text x="862" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#d7e2f0" text-anchor="start">Target writes enabled</text><text x="862" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#d7e2f0" text-anchor="start">Simple rollback closed</text><line x1="365" y1="200" x2="440" y2="200" stroke="#7aa9d8" stroke-width="3" marker-end="url(#arrow)"/><line x1="755" y1="200" x2="830" y2="200" stroke="#7aa9d8" stroke-width="3" marker-end="url(#arrow)"/><rect x="60" y="385" width="480" height="140" rx="14" fill="#ffffff" stroke="#7aa9d8" stroke-width="2"/><text x="82" y="421" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b1f3a" text-anchor="start">Before acceptance</text><text x="82" y="454" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Rollback to source is available</text><text x="82" y="481" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Repeat migration if source changes</text><rect x="660" y="385" width="480" height="140" rx="14" fill="#ffffff" stroke="#7aa9d8" stroke-width="2"/><text x="682" y="421" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b1f3a" text-anchor="start">After acceptance</text><text x="682" y="454" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Retire source when approved</text><text x="682" y="481" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Recovery requires data reconciliation</text><text x="60" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526a86" text-anchor="start">Never replace post-accept recovery with an unverified DNS change.</text></svg>
