<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Quality and migration pipeline"><title>Quality and migration pipeline</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f7fbff"/><stop offset="100%" stop-color="#eaf2fb"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7aa9d8"/></marker></defs><rect width="1200" height="620" fill="url(#bg)"/><text x="60" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0b1f3a" text-anchor="start">Review source changes before running migration stages</text><rect x="60" y="110" width="330" height="170" rx="14" fill="#ffffff" stroke="#7aa9d8" stroke-width="2"/><text x="82" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b1f3a" text-anchor="start">Source quality</text><text x="82" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Terraform and PowerShell</text><text x="82" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Application build / tests</text><text x="82" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Security and policy</text><rect x="435" y="110" width="330" height="170" rx="14" fill="#ffffff" stroke="#7aa9d8" stroke-width="2"/><text x="457" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b1f3a" text-anchor="start">Documentation</text><text x="457" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Generated references</text><text x="457" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Links, anchors, assets</text><text x="457" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Consistent diagrams</text><rect x="810" y="110" width="330" height="170" rx="14" fill="#ffffff" stroke="#7aa9d8" stroke-width="2"/><text x="832" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b1f3a" text-anchor="start">Review evidence</text><text x="832" y="179" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">CI results and artifacts</text><text x="832" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Profile and state context</text><text x="832" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Change impact</text><rect x="60" y="380" width="510" height="145" rx="14" fill="#ffffff" stroke="#7aa9d8" stroke-width="2"/><text x="82" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b1f3a" text-anchor="start">Explicit live operation</text><text x="82" y="449" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">OIDC + protected environment</text><text x="82" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Selected stage + durable checkpoint</text><rect x="630" y="380" width="510" height="145" rx="14" fill="#ffffff" stroke="#7aa9d8" stroke-width="2"/><text x="652" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b1f3a" text-anchor="start">Observe and recover</text><text x="652" y="449" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Journal + manifests + logs</text><text x="652" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526a86" text-anchor="start">Validation gates + guarded cleanup</text><text x="60" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#526a86" text-anchor="start">Static success does not establish a successful Azure deployment or data migration.</text></svg>
