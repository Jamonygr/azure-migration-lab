name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install verified quality tools
        shell: pwsh
        run: ./scripts/quality/Install-QualityTools.ps1
      - name: Install PowerShell and Python checks
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          python -m pip install --disable-pip-version-check checkov==3.4.0
          if ($LASTEXITCODE -ne 0) { throw 'Checkov installation failed.' }
      - name: Full credential-free validation
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          LOG_LEVEL: ERROR
        run: ./scripts/quality/Test-Repository.ps1
