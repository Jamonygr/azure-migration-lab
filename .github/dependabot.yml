version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: nuget
    directory: /app/MigrationLab
    schedule: {interval: weekly}
  - package-ecosystem: terraform
    directories: [/stacks/foundation, /stacks/source, /stacks/target, /stacks/cutover]
    schedule: {interval: weekly}
